# SightLine seed taxonomy.
# Each category becomes an anchor ring in the graph; subclasses are anchors in `order`
# (neighbors should be visually similar so mixed images land on a sensible gradient).
#
# kind:    spectrum = opposite ends of one axis, tags = independent qualities
# pixel:   name of a pixel metric in pipeline/pixel.py that scores this subclass (optional)
# weight:  share of the pixel score in the combined score (rest is SigLIP). Default 0.5.
#          Use 1.0 for purely measurable subclasses, 0.0 / no `pixel` for perceptual ones.
# prompts: SigLIP text prompts (ensemble). Describe the visual mechanism, not a subject.

categories:
  - id: line
    name: Line
    kind: tags
    description: The character of the lines that structure the image.
    subclasses:
      - id: straight
        name: Straight
        definition: Rigid, architectural lines; calm when horizontal, stable when vertical.
        pixel: line_straight
        weight: 0.6
        prompts:
          - a composition built from straight rigid lines
          - a graphic design with strong horizontal and vertical lines
          - an architectural image made of straight edges and right angles
      - id: jagged
        name: Jagged
        definition: Zigzags and sharp angles that read as tension or energy.
        pixel: line_jagged
        weight: 0.5
        prompts:
          - a graphic made of sharp zigzag lines
          - an illustration with jagged angular strokes
          - an energetic image full of sharp spiky angles
      - id: curved
        name: Curved
        definition: Flowing, graceful, soft lines (Art Nouveau, Matisse's cut-outs).
        pixel: line_curved
        weight: 0.5
        prompts:
          - a composition of flowing curved lines
          - an art nouveau style illustration with graceful curves
          - soft rounded organic curving lines
      - id: implied
        name: Implied
        definition: Lines the eye completes on its own, like a gaze or a row of dots.
        prompts:
          - a row of separate objects that the eye connects into a line
          - a person's gaze creating an invisible line across the image
          - a dotted or broken line that the viewer completes

  - id: shape
    name: Shape
    kind: tags
    description: Dominant flat shapes, including shapes that depict volume.
    subclasses:
      - id: rectangle
        name: Rectangle
        definition: Order and structure (Mondrian's grids).
        pixel: shape_rectangle
        weight: 0.4
        prompts:
          - a composition built from rectangles and grids
          - a mondrian style grid of rectangular blocks
          - a layout dominated by square and rectangular shapes
      - id: triangle
        name: Triangle
        definition: Stability when sitting on its base, tension when inverted.
        pixel: shape_triangle
        weight: 0.4
        prompts:
          - a composition dominated by triangular shapes
          - a graphic built around a strong triangle
          - pointed triangular forms and pyramids
      - id: circle
        name: Circle
        definition: Wholeness and enclosure (halos, mandalas, rose windows).
        pixel: shape_circle
        weight: 0.4
        prompts:
          - a composition dominated by circles
          - a graphic built around a large circular shape
          - round discs, rings and circular forms
      - id: organic
        name: Organic
        definition: Irregular natural shapes like leaves, pebbles and bodies.
        prompts:
          - irregular organic shapes like leaves and pebbles
          - free-form natural blob shapes
          - a composition of soft irregular body-like shapes

  - id: form
    name: Form
    kind: tags
    description: Volume as depicted in a 2D image (shading, rendering). Expected to be noisy on flat graphics.
    subclasses:
      - id: geometric
        name: Geometric
        definition: Crisp solids such as cubes, spheres and cylinders.
        prompts:
          - shaded geometric solids like cubes spheres and cylinders
          - a rendered illustration of crisp three dimensional geometric forms
      - id: organic
        name: Organic
        definition: Rounded, flowing volumes (Henry Moore, Barbara Hepworth).
        prompts:
          - smooth rounded flowing three dimensional volumes
          - an image of soft sculptural organic forms
      - id: open
        name: Open
        definition: Forms pierced by holes or built from frameworks that let space through.
        prompts:
          - an open framework structure that lets space through
          - a form pierced with holes and gaps
          - a wireframe lattice structure

  - id: space
    name: Space
    kind: spectrum
    description: How much depth the image creates, and how much of it is empty.
    subclasses:
      - id: shallow
        name: Shallow
        definition: Compressed, stage-like or flat (Egyptian reliefs, Japanese prints).
        pixel: space_shallow
        weight: 0.3
        prompts:
          - a flat graphic with no depth
          - a compressed stage-like shallow space
          - a flat illustration like a japanese woodblock print
      - id: negative
        name: Negative space
        definition: Large empty areas that become part of the subject.
        pixel: space_negative
        weight: 0.7
        prompts:
          - a minimal image with large areas of empty negative space
          - a small subject surrounded by vast empty background
          - negative space forming part of the design
      - id: deep
        name: Deep
        definition: A convincing illusion of distance through perspective and atmosphere.
        prompts:
          - an image with deep perspective receding into the distance
          - a landscape with strong atmospheric depth
          - a vanishing point perspective with a far horizon

  - id: color
    name: Color
    kind: tags
    description: Temperature and harmony of the palette.
    subclasses:
      - id: warm
        name: Warm
        definition: Reds, oranges and yellows that advance and energize.
        pixel: color_warm
        weight: 0.8
        prompts:
          - an image dominated by warm reds oranges and yellows
          - a warm toned color palette
      - id: complementary
        name: Complementary
        definition: Opposite hues placed together for vibrancy.
        pixel: color_complementary
        weight: 0.8
        prompts:
          - complementary colors placed side by side like red and green
          - a vibrant clash of opposite colors orange and blue
      - id: cool
        name: Cool
        definition: Blues, greens and violets that recede and calm.
        pixel: color_cool
        weight: 0.8
        prompts:
          - an image dominated by cool blues greens and violets
          - a cool toned calm color palette
      - id: monochromatic
        name: Monochromatic
        definition: One hue in many shades (Picasso's Blue Period).
        pixel: color_monochromatic
        weight: 0.8
        prompts:
          - a monochromatic image in shades of a single color
          - a single hue palette with many tints and shades

  - id: value
    name: Value
    kind: spectrum
    description: Overall lightness of the tones.
    subclasses:
      - id: high_key
        name: High-key
        definition: Mostly light tones, airy and delicate.
        pixel: value_high
        weight: 1.0
        prompts:
          - a bright airy high key image of mostly light tones
      - id: low_key
        name: Low-key
        definition: Mostly dark tones, moody and dramatic.
        pixel: value_low
        weight: 1.0
        prompts:
          - a dark moody low key image of mostly dark tones

  - id: texture
    name: Texture
    kind: spectrum
    description: Visual texture of surfaces.
    subclasses:
      - id: smooth
        name: Smooth
        definition: Uniform, clean surfaces.
        pixel: texture_smooth
        weight: 0.8
        prompts:
          - smooth clean uniform flat surfaces
          - a clean vector graphic with flat fills
      - id: rough
        name: Detailed / Rough
        definition: Dense surface detail, grain and roughness.
        pixel: texture_rough
        weight: 0.8
        prompts:
          - rough grainy richly detailed texture
          - a heavily textured surface full of fine detail

  - id: balance
    name: Balance
    kind: tags
    description: How visual weight is distributed.
    subclasses:
      - id: bilateral
        name: Bilateral symmetry
        definition: One side mirrors the other across a central line.
        pixel: balance_bilateral
        weight: 0.7
        prompts:
          - a perfectly symmetrical composition mirrored left and right
          - bilateral symmetry across a central axis
      - id: radial
        name: Radial symmetry
        definition: Elements spread from a center point (rose windows, mandalas).
        pixel: balance_radial
        weight: 0.5
        prompts:
          - a radially symmetric mandala design
          - elements radiating outward from a center point like a rose window
      - id: asymmetrical
        name: Asymmetrical
        definition: Unequal elements that still feel even through visual weight.
        prompts:
          - an asymmetrical but balanced composition
          - a large element on one side balanced by small elements on the other

  - id: contrast
    name: Contrast
    kind: tags
    description: Which kind of difference creates impact.
    subclasses:
      - id: value
        name: Value contrast
        definition: Light against dark.
        pixel: contrast_value
        weight: 0.8
        prompts:
          - strong contrast of bright light against deep black
          - a high contrast black and white image
      - id: color
        name: Color contrast
        definition: Clashing hues, or saturated against muted.
        pixel: contrast_color
        weight: 0.7
        prompts:
          - a saturated color element against a muted gray background
          - clashing contrasting colors
      - id: scale
        name: Scale contrast
        definition: Big against small.
        prompts:
          - a huge object next to a tiny object
          - dramatic contrast of scale between big and small elements

  - id: emphasis
    name: Emphasis
    kind: tags
    description: How the eye is pulled to the focal point.
    subclasses:
      - id: centered
        name: Centered focal point
        definition: The subject sits in the middle of the composition.
        pixel: emphasis_centered
        weight: 0.6
        prompts:
          - a single subject placed in the exact center of the frame
          - a centered focal point composition
      - id: isolation
        name: Isolation
        definition: One element set apart from everything else.
        pixel: emphasis_isolation
        weight: 0.5
        prompts:
          - one element isolated and set apart from a group
          - a lone object separated from everything else
      - id: convergence
        name: Convergence
        definition: Lines or gazes that all point to one spot.
        prompts:
          - lines converging on a single focal point
          - many people looking toward the same spot

  - id: movement
    name: Movement
    kind: tags
    description: The motion the composition implies.
    subclasses:
      - id: diagonal
        name: Diagonal
        definition: Action and instability (Hokusai's The Great Wave).
        pixel: movement_diagonal
        weight: 0.6
        prompts:
          - a dynamic composition of strong diagonal lines
          - tilted diagonal forms suggesting action and instability
      - id: directional
        name: Directional
        definition: Leading lines that carry the eye along a path.
        pixel: movement_directional
        weight: 0.4
        prompts:
          - leading lines guiding the eye along a path
          - a road or path leading the viewer through the image
      - id: swirling
        name: Swirling
        definition: Circular, spiraling motion (The Starry Night).
        prompts:
          - swirling spiraling circular motion like starry night
          - a vortex of swirling brushstrokes

  - id: rhythm
    name: Rhythm & pattern
    kind: tags
    description: Repetition across the image.
    subclasses:
      - id: regular
        name: Regular
        definition: Identical elements repeated at even intervals.
        pixel: rhythm_regular
        weight: 0.6
        prompts:
          - identical elements repeated at even intervals
          - a regular repeating pattern grid
      - id: alternating
        name: Alternating
        definition: Two or more motifs taking turns, like a checkerboard.
        prompts:
          - two alternating motifs like a checkerboard
          - an alternating pattern of two different shapes
      - id: progressive
        name: Progressive
        definition: Elements that gradually change in size, color or spacing.
        prompts:
          - repeated elements that gradually grow in size
          - a progression of shapes changing step by step in color

  - id: unity
    name: Unity & variety
    kind: spectrum
    description: How cohesive or busy the whole image feels.
    subclasses:
      - id: minimal
        name: Minimal
        definition: Pared down to a few elements.
        pixel: unity_minimal
        weight: 0.7
        prompts:
          - a minimalist design with very few elements
          - a pared down simple composition
      - id: harmonious
        name: Harmonious
        definition: Similar colors, shapes and textures that feel cohesive.
        pixel: unity_harmonious
        weight: 0.5
        prompts:
          - a harmonious cohesive image with similar colors and shapes
          - a unified consistent visual style
      - id: chaotic
        name: Chaotic
        definition: Dense variety and visual noise on purpose (Pollock, maximalist collage).
        pixel: unity_chaotic
        weight: 0.7
        prompts:
          - a chaotic dense maximalist collage full of visual noise
          - a busy cluttered composition with many different elements
